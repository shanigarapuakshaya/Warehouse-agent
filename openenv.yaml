name: warehouse-agent
version: 1.0.0

description: Warehouse navigation and item pickup environment

tasks:
  easy:
    description: 4x4 warehouse navigation
  medium:
    description: 6x6 warehouse navigation
  hard:
    description: 8x8 warehouse navigation

action_space:
  type: discrete
  actions: ["up", "down", "left", "right", "pick"]

observation_space:
  position: [int, int]
  goal: [int, int]
  item_picked: bool
  steps: int

reward:
  type: scalar
  range: [0.0, 1.0]
